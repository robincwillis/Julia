<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Brown Butter Banana Bread — Fixture Media</title>
  <!-- Large food media sites usually nest the Recipe inside an @graph array,
       alongside WebSite / WebPage / BreadcrumbList nodes. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      { "@type": "WebSite", "name": "Fixture Media", "url": "https://example.test" },
      { "@type": "BreadcrumbList", "itemListElement": [] },
      {
        "@type": ["Recipe", "NewsArticle"],
        "name": "Brown Butter Banana Bread",
        "description": "Deeply browned butter makes an ordinary loaf taste like toffee.",
        "author": [{ "@type": "Person", "name": "Grace Hopperson" }],
        "prepTime": "PT20M",
        "cookTime": "PT1H10M",
        "recipeYield": [ "1 loaf", "10 slices" ],
        "recipeIngredient": [
          "3 very ripe bananas, mashed",
          "125 g unsalted butter",
          "200 g light brown sugar",
          "2 large eggs",
          "250 g all-purpose flour",
          "1 teaspoon baking soda",
          "1/2 teaspoon fine salt"
        ],
        "recipeInstructions": [
          "Brown the butter in a light-coloured pan until it smells nutty, then cool slightly.",
          "Whisk the butter into the sugar, then beat in the eggs and mashed banana.",
          "Fold in the flour, baking soda and salt until just combined.",
          "Bake at 350F for 60 to 70 minutes, until a skewer comes out clean."
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <h1>Brown Butter Banana Bread</h1>
</body>
</html>
